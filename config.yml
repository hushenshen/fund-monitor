# LOF/ETF 溢价率监控配置文件
# 修改此文件后 docker-compose restart 即可生效，无需重新构建镜像

# 飞书机器人 Webhook 地址
webhook_url: "XXX"

# 监控标的列表
# 字段说明:
#   code:      富途股票代码（SZ.xxxxxx / SH.xxxxxx）
#   name:      标的名称（飞书通知中显示）
#   threshold: 溢价率阈值（%），当前溢价率 < 此值时触发通知
#   type:      类型，LOF 或 ETF
#   nav_field: 净值来源（prev_close: 昨收价 / nav: 基金净值 / iopv: 实时参考净值）
#
# 溢价率计算公式: (实时交易价 / 参考净值 - 1) × 100%
monitor_list:
  - code: "SZ.160644"
    name: "鹏华港美互联网LOF"
    threshold: 2.0
    type: "LOF"
    nav_field: "prev_close"

