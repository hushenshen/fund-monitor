# ============================================================
# fund-monitor — Docker Compose 部署
# ============================================================
#
# 前置条件：
#   宿主机需要运行 OpenD 客户端（默认在 host.docker.internal:11111）
#
# 配置说明：
#   监控标的列表在 config.yml 中维护，修改后 docker-compose restart 即可生效，
#   无需重新构建 Docker 镜像。
#
# 使用方式：
#   docker-compose up -d                # 后台启动（默认60秒循环）
#   docker-compose run --rm monitor --loop 120  # 120秒间隔
#   docker-compose down                 # 停止
# ============================================================

services:
  monitor:
    image: deeplakehss/fund-monitor:latest
    container_name: fund-monitor
    restart: always

    # 循环监控模式，每60秒检测一次
    command: ["--loop", "60"]

    volumes:
      # 挂载配置文件，修改 config.yml 后 docker-compose restart 即可生效
      - ./config.yml:/app/config.yml:ro

    environment:
      # 飞书 Webhook 地址（可选，config.json 中也支持配置）
      # FEISHU_WEBHOOK_URL: "https://open.feishu.cn/open-apis/bot/v2/hook/xxx"

      # OpenD 连接（Docker 内部通过 host.docker.internal 访问宿主机的 OpenD）
      FUTU_OPEND_HOST: "host.docker.internal"
      FUTU_OPEND_PORT: "11111"

      # Python 日志输出不缓冲（Docker 日志实时可见）
      PYTHONUNBUFFERED: "1"

    # 使用 host 网络模式可以解决 host.docker.internal 在某些环境不可用的问题
    # network_mode: host

    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 内存限制
    deploy:
      resources:
        limits:
          memory: 256M
