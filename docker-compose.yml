# ============================================================
# fund-monitor — Docker Compose 部署（含 OpenD）
# ============================================================
#
# 服务说明：
#   opend    — 富途 OpenD 网关（提供行情数据接口）
#   monitor  — LOF/ETF 溢价率监控脚本
#
# 前置条件：
#   1. 首次运行 OpenD 需要登录（短信验证）
#   2. 登录态通过 volume 持久化，后续无需重复登录
#
# 配置说明：
#   1. 复制 .env.example 为 .env，填入富途账号密码
#   2. 监控标的列表在 config.yml 中维护
#
# 使用方式：
#   docker-compose up -d                # 后台启动所有服务
#   docker-compose logs -f opend        # 查看 OpenD 日志（首次运行需在此查看验证码）
#   docker-compose logs -f monitor      # 查看监控日志
#   docker-compose down                 # 停止并移除容器
#   docker-compose down -v              # 停止并清除数据（会丢失登录态）
# ============================================================

version: "3.8"

networks:
  fund-net:
    driver: bridge

services:
  # ----------------------------------------------------------
  # OpenD — 富途行情网关
  # ----------------------------------------------------------
  opend:
    # 使用社区维护的 OpenD Docker 镜像
    # 如需自行构建，参考 opend/ 目录下的 Dockerfile
    image: ghcr.io/manhinhang/futu-opend-docker:ubuntu-stable
    container_name: fund-opend
    restart: always

    networks:
      - fund-net

    ports:
      # OpenD 行情接口（供 monitor 连接）
      - "11111:11111"
      # OpenD Telnet 管理端口（可选）
      - "22222:22222"

    volumes:
      # 持久化登录态（重启后无需重新登录）
      - opend-data:/home/futu/.com.futunn.FutuOpenD
      # 可选：挂载自定义 FutuOpenD.xml 配置
      # - ./opend/custom.xml:/home/futu/FutuOpenD.xml:ro

    environment:
      # 富途账号（手机号/邮箱/数字ID）
      FUTU_ACCOUNT_ID: ${FUTU_ACCOUNT_ID:-}
      # 富途密码（明文或 MD5）
      FUTU_ACCOUNT_PWD: ${FUTU_ACCOUNT_PWD:-}
      # 监听地址（容器内需监听 0.0.0.0 以允许外部访问）
      FUTU_OPEND_IP: "0.0.0.0"
      FUTU_OPEND_PORT: "11111"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------
  # monitor — LOF/ETF 溢价率监控
  # ----------------------------------------------------------
  monitor:
    image: deeplakehss/fund-monitor:latest
    container_name: fund-monitor
    restart: always

    networks:
      - fund-net

    # 循环监控模式，每60秒检测一次
    command: ["--loop", "60"]

    volumes:
      # 挂载配置文件，修改 config.yml 后 docker-compose restart 即可生效
      - ./config.yml:/app/config.yml:ro
      # 监控日志（可选，方便排查）
      - ./logs:/app/logs

    environment:
      # OpenD 连接地址（通过 Docker 内部网络访问 opend 服务）
      FUTU_OPEND_HOST: "opend"
      FUTU_OPEND_PORT: "11111"

      # Python 日志输出不缓冲（Docker 日志实时可见）
      PYTHONUNBUFFERED: "1"

    # 依赖 opend 服务先启动
    depends_on:
      - opend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 256M

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  opend-data:
    driver: local
