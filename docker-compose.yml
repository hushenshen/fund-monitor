# ============================================================
# fund-monitor — Docker Compose 部署（含 OpenD）
# ============================================================
#
# 服务说明：
#   opend    — 富途 OpenD 网关（提供行情数据接口）
#   monitor  — LOF/ETF 溢价率监控脚本
#
# 前置条件：
#   1. 生成 RSA 密钥：openssl genrsa -out futu.pem 1024
#   2. 配置 .env 文件（基于 .env.example）
#   3. 配置 config.yml（监控标的 + 飞书 Webhook）
#   4. 首次运行需输入验证码（通过 Telnet 端口 22222）
#
# 登录态：通过 opend-data volume 持久化，重启无需重新登录。
#
# 使用方式：
#   docker compose up -d              # 后台启动
#   docker compose logs -f opend       # 查看 OpenD 日志
#   docker compose logs -f monitor     # 查看监控日志
#   docker compose down                # 停止
#   docker compose down -v             # 停止并清除数据（丢失登录态）
# ============================================================

services:
  # ----------------------------------------------------------
  # OpenD — 富途行情网关
  # 镜像来源：https://github.com/manhinhang/futu-opend-docker
  # ----------------------------------------------------------
  opend:
    image: ghcr.io/manhinhang/futu-opend-docker:ubuntu-stable
    container_name: fund-opend
    restart: always

    # 使用 host 网络模式，避免 Docker bridge 导致连接富途认证服务器失败。
    # 如需使用 bridge 模式，取消 network_mode 注释并启用 ports 映射。
    network_mode: host

    # 如果不用 host 模式，改用 bridge：
    # ports:
    #   - "11111:11111"   # OpenD 行情 API
    #   - "22222:22222"   # Telnet（验证码输入）

    volumes:
      # RSA 密钥文件（启动前先执行 openssl genrsa -out futu.pem 1024）
      - ./futu.pem:/.futu/futu.pem:ro

      # 持久化登录态（重启后无需重新登录）
      - opend-data:/home/futu/.com.futunn.FutuOpenD

    environment:
      # 富途账号（手机号 / 邮箱 / 数字ID）
      FUTU_ACCOUNT_ID: ${FUTU_ACCOUNT_ID}

      # 推荐：密码 MD5（避免明文密码泄露在日志/配置中）
      # 生成方式：echo -n "你的密码" | md5sum | awk '{print $1}'
      # 如果同时设置了 MD5 和明文，MD5 优先生效
      FUTU_ACCOUNT_PWD_MD5: ${FUTU_ACCOUNT_PWD_MD5:-}

      # 已弃用（备选）：明文密码，会触发 stderr 警告
      FUTU_ACCOUNT_PWD: ${FUTU_ACCOUNT_PWD:-}

      # OpenD 监听地址和端口
      FUTU_OPEND_IP: "0.0.0.0"
      FUTU_OPEND_PORT: "11111"
      FUTU_OPEND_TELNET_PORT: "22222"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # monitor — LOF/ETF 溢价率监控
  # ----------------------------------------------------------
  monitor:
    image: deeplakehss/fund-monitor:latest
    container_name: fund-monitor
    restart: always

    network_mode: host

    command: ["--loop", "60"]

    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./logs:/app/logs

    environment:
      # 连接同机 OpenD（host 网络模式下用 127.0.0.1）
      FUTU_OPEND_HOST: "127.0.0.1"
      FUTU_OPEND_PORT: "11111"
      PYTHONUNBUFFERED: "1"

    depends_on:
      - opend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  opend-data:
    driver: local
